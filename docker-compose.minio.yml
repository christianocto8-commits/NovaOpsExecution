services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: novaops_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - novaops_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-22T03-04-18Z
    container_name: novaops_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb local/novaops-evidence --ignore-existing;
      mc anonymous set download local/novaops-evidence;
      echo 'MinIO bucket novaops-evidence ready';
      "

volumes:
  novaops_minio_data:
