services:
  - type: web
    name: novaops-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    # Migrations run before the new container receives traffic (not during startup).
    preDeployCommand: timeout 120 alembic upgrade head
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        sync: false
      - key: TASK_SCHEDULER_SECRET
        sync: false

  - type: cron
    name: novaops-task-scheduler
    runtime: image
    schedule: "*/15 * * * *"
    image:
      url: curlimages/curl:latest
    dockerCommand: >-
      curl -fsS --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors
      -X POST "${NOVAOPS_API_URL}/api/v1/task-schedules/process"
      -H "X-Scheduler-Secret: ${TASK_SCHEDULER_SECRET}"
    envVars:
      - key: NOVAOPS_API_URL
        sync: false
      - key: TASK_SCHEDULER_SECRET
        fromService:
          type: web
          name: novaops-api
          envVarKey: TASK_SCHEDULER_SECRET
