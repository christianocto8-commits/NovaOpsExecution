name: NovaOps Enterprise Quality

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novaops
          POSTGRES_USER: novaops
          POSTGRES_PASSWORD: novaops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novaops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://novaops:novaops@localhost:5432/novaops
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_EMAIL: admin@novaops.com
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      PYTHONPATH: apps/api
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup and test frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Install backend system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxslt1-dev libxmlsec1-dev xmlsec1

      - name: Install backend Python packages
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Bootstrap admin account
        working-directory: apps/api
        run: python -c "from app.bootstrap.ensure_online_admin import ensure_online_admin; ensure_online_admin()"

      - name: Run backend pytest suite
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest -q
