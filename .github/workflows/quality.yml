name: NovaOps Enterprise Quality

on:

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        shell: bash
        run: |
          if [ -f ./bootstrap.ps1 ]; then
            pwsh ./bootstrap.ps1
          else
            docker compose up -d postgres
            python3 -m pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
            cp -n apps/api/.env.example apps/api/.env || true
          fi

      - name: Enterprise CI
        shell: bash
        run: |
          if [ -f ./novaops.ps1 ]; then
            pwsh ./novaops.ps1 ci
          else
            cd apps/api && DATABASE_URL="${DATABASE_URL:-postgresql://novaops_user:novaops_password@localhost:5433/novaops_db}" python3 -m pytest -q
          fi
