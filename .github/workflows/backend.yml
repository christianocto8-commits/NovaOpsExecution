name: NovaOps Backend CI

on:

  push:
    branches: [ main ]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"

  pull_request:
    branches: [ main ]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"

jobs:

  backend:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_DB: novaops
          POSTGRES_USER: novaops
          POSTGRES_PASSWORD: novaops

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U novaops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:

      run:
        working-directory: apps/api

    env:

      DATABASE_URL: postgresql+psycopg://novaops:novaops@localhost:5432/novaops

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: pip install -r requirements.txt

      - run: alembic upgrade head

      - run: python seed_admin.py
