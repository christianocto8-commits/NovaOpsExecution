name: NovaOps Native Mobile Build CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-mobile:
    name: Build Mobile Capacitor Artifacts (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Next.js Static Export
        working-directory: ./apps/web
        env:
          CAPACITOR_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Sync Capacitor Web Assets
        working-directory: ./apps/web
        run: npx cap sync android

      - name: Build Android APK (Debug & Unsigned Release)
        working-directory: ./apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novaops-android-apk
          path: apps/web/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
