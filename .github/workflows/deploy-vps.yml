name: NovaOps VPS Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaops-vps-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to NovaOps VPS
    runs-on: ubuntu-latest
    environment: production

    env:
      NOVAOPS_VPS_HOST: ${{ secrets.NOVAOPS_VPS_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare SSH key
        shell: bash
        env:
          NOVAOPS_VPS_SSH_KEY_VALUE: ${{ secrets.NOVAOPS_VPS_SSH_KEY }}
        run: |
          if [ -z "$NOVAOPS_VPS_SSH_KEY_VALUE" ]; then
            echo "::error::Secret NOVAOPS_VPS_SSH_KEY belum diisi."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          KEY_PATH="$HOME/.ssh/novaops_vps_ed25519"
          printf '%s' "$NOVAOPS_VPS_SSH_KEY_VALUE" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "NOVAOPS_VPS_SSH_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          if [ -n "${NOVAOPS_VPS_HOST:-}" ]; then
            ssh-keyscan -H "${NOVAOPS_VPS_HOST#*@}" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fast deploy live to VPS
        shell: bash
        run: |
          chmod +x ./scripts/deploy-vps-ci-fast.sh
          ./scripts/deploy-vps-ci-fast.sh

      - name: Verify production health
        shell: bash
        run: |
          curl -fsS https://nova-ops.cloud/api/v1/health
