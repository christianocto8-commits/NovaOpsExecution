name: NovaOps VPS Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaops-vps-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to NovaOps VPS
    runs-on: ubuntu-latest
    environment: production

    env:
      NOVAOPS_VPS_HOST: ${{ secrets.NOVAOPS_VPS_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare SSH key
        shell: bash
        env:
          NOVAOPS_VPS_SSH_KEY_VALUE: ${{ secrets.NOVAOPS_VPS_SSH_KEY }}
        run: |
          if [ -z "$NOVAOPS_VPS_SSH_KEY_VALUE" ]; then
            echo "::error::Secret NOVAOPS_VPS_SSH_KEY belum diisi."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          KEY_PATH="$HOME/.ssh/novaops_vps_ed25519"
          export KEY_PATH
          python - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          key_value = os.environ["NOVAOPS_VPS_SSH_KEY_VALUE"].strip()
          key_path = pathlib.Path(os.environ["KEY_PATH"])

          def write_key(text: str) -> None:
              normalized = text.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
              key_path.write_text(normalized, encoding="utf-8")

          if "BEGIN OPENSSH PRIVATE KEY" in key_value:
              write_key(key_value)
          else:
              try:
                  decoded = base64.b64decode(key_value).decode("utf-8")
              except Exception as exc:  # pragma: no cover - workflow runtime path
                  print(
                      "::error::Secret NOVAOPS_VPS_SSH_KEY harus berupa private key OpenSSH utuh atau base64 dari file key.",
                      file=sys.stderr,
                  )
                  print(f"decode error: {exc}", file=sys.stderr)
                  sys.exit(1)
              write_key(decoded)
          PY
          chmod 600 "$KEY_PATH"
          ssh-keygen -y -f "$KEY_PATH" >/dev/null
          echo "NOVAOPS_VPS_SSH_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          if [ -n "${NOVAOPS_VPS_HOST:-}" ]; then
            ssh-keyscan -H "${NOVAOPS_VPS_HOST#*@}" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fast deploy live to VPS
        shell: bash
        run: |
          chmod +x ./scripts/deploy-vps-ci-fast.sh
          ./scripts/deploy-vps-ci-fast.sh

      - name: Verify production health
        shell: bash
        run: |
          curl -fsS https://nova-ops.cloud/api/v1/health
