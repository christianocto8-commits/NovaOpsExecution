name: NovaOps VPS Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaops-vps-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to NovaOps VPS
    runs-on: ubuntu-latest
    environment: production

    env:
      NOVAOPS_VPS_HOST: ${{ secrets.NOVAOPS_VPS_HOST }}
      HAS_ANDROID_KEYSTORE: ${{ secrets.NOVAOPS_ANDROID_KEYSTORE_B64 }}
      HAS_VPS_KEY: ${{ secrets.NOVAOPS_VPS_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare SSH key
        if: ${{ env.HAS_VPS_KEY != '' }}
        shell: bash
        env:
          NOVAOPS_VPS_SSH_KEY_VALUE: ${{ secrets.NOVAOPS_VPS_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          KEY_PATH="$HOME/.ssh/novaops_vps_ed25519"
          export KEY_PATH
          python - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          key_value = os.environ["NOVAOPS_VPS_SSH_KEY_VALUE"].strip()
          key_path = pathlib.Path(os.environ["KEY_PATH"])

          def write_key(text: str) -> None:
              normalized = text.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
              key_path.write_text(normalized, encoding="utf-8")

          if "BEGIN OPENSSH PRIVATE KEY" in key_value:
              write_key(key_value)
          else:
              try:
                  decoded = base64.b64decode(key_value).decode("utf-8")
              except Exception as exc:  # pragma: no cover - workflow runtime path
                  print(
                      "::error::Secret NOVAOPS_VPS_SSH_KEY harus berupa private key OpenSSH utuh atau base64 dari file key.",
                      file=sys.stderr,
                  )
                  print(f"decode error: {exc}", file=sys.stderr)
                  sys.exit(1)
              write_key(decoded)
          PY
          chmod 600 "$KEY_PATH"
          ssh-keygen -y -f "$KEY_PATH" >/dev/null
          echo "NOVAOPS_VPS_SSH_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          if [ -n "${NOVAOPS_VPS_HOST:-}" ]; then
            ssh-keyscan -H "${NOVAOPS_VPS_HOST#*@}" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxslt1-dev libxmlsec1-dev xmlsec1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true

      - name: Prepare release signing key
        shell: bash
        env:
          NOVAOPS_ANDROID_KEYSTORE_B64: ${{ secrets.NOVAOPS_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          if [ -z "${NOVAOPS_ANDROID_KEYSTORE_B64:-}" ]; then
            echo "Keystore secret kosong — lanjut deploy web/backend tanpa APK release."
            exit 0
          fi
          echo "$NOVAOPS_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android/release.jks"

      - name: Build offline Capacitor bundle + sync
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        working-directory: apps/web
        env:
          CAPACITOR_ENV: production
          CAPACITOR_OFFLINE: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: node scripts/release-offline-android.mjs

      - name: Build signed release APK
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        working-directory: apps/web/android
        env:
          NOVAOPS_ANDROID_KEYSTORE: ${{ runner.temp }}/android/release.jks
          NOVAOPS_ANDROID_KEY_ALIAS: ${{ secrets.NOVAOPS_ANDROID_KEY_ALIAS }}
          NOVAOPS_ANDROID_STORE_PASSWORD: ${{ secrets.NOVAOPS_ANDROID_STORE_PASSWORD }}
          NOVAOPS_ANDROID_KEY_PASSWORD: ${{ secrets.NOVAOPS_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK into web public downloads
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        shell: bash
        run: |
          APK="apps/web/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Release APK tidak ditemukan setelah build."
            exit 1
          fi
          mkdir -p apps/web/public/downloads
          cp "$APK" apps/web/public/downloads/NovaOps-Outlet-MatePad.apk
          ls -la apps/web/public/downloads

      - name: Fast deploy live to VPS
        if: ${{ env.HAS_VPS_KEY != '' }}
        shell: bash
        run: |
          chmod +x ./scripts/deploy-vps-ci-fast.sh
          ./scripts/deploy-vps-ci-fast.sh

      - name: Verify production health
        shell: bash
        run: |
          curl -fsS https://nova-ops.cloud/api/v1/health
